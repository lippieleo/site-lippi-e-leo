media:
  input: media
  output: /media
content:
  - name: agenda
    label: Agenda de Shows
    type: file
    path: agenda/shows.json
    format: json
    list: true
    operations:
      delete: false
    fields:
      - name: date
        label: Data do show
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: city
        label: Cidade e estado
        type: string
        required: true
      - name: venue
        label: Local ou evento
        type: string
        required: true
      - name: time
        label: Horário (opcional)
        type: string
      - name: notes
        label: Informações adicionais
        type: text
      - name: tickets
        label: Link dos ingressos (opcional)
        type: string
  - name: inicio
    label: Foto e vídeo da página inicial
    type: file
    path: settings/home.json
    format: json
    fields:
      - name: photo
        label: Foto principal
        type: image
        required: false
      - name: video
        label: Vídeo de fundo (MP4)
        type: file
        required: false
      - name: mode
        label: Exibir na abertura
        type: select
        options:
          values:
            - value: photo
              label: Foto
            - value: video
              label: Vídeo
        required: false

  - name: fotos_secoes
    label: Fotos das outras abas
    type: file
    path: settings/sections.json
    format: json
    fields:
      - name: biografia
        label: Foto de fundo - Biografia
        type: image
        required: false
      - name: agenda
        label: Foto de fundo - Agenda
        type: image
        required: false
      - name: videos
        label: Foto de fundo - Vídeos
        type: image
        required: false
      - name: contrate
        label: Foto de fundo - Contrate
        type: image
        required: false
      - name: contato
        label: Foto de fundo - Contato
        type: image
        required: false

  - name: catalogo_videos
    label: Gerenciar vídeos
    type: file
    path: settings/videos.json
    format: json
    list: true
    fields:
      - name: title
        label: Título do vídeo
        type: string
        required: true
      - name: category
        label: Categoria
        type: select
        required: true
        options:
          values:
            - value: dvd
              label: DVD
            - value: prefeitura
              label: Shows Prefeitura
            - value: corporativo
              label: Corporativo
            - value: casamentos
              label: Casamentos
      - name: video
        label: Arquivo de vídeo MP4 (opcional)
        type: file
      - name: youtube
        label: Link do YouTube (opcional)
        type: string
      - name: cover
        label: Capa do vídeo (opcional)
        type: image
      - name: description
        label: Descrição
        type: text

  - name: equipe
    label: Equipe da Banda
    type: file
    path: settings/equipe.json
    format: json
    list: true
    fields:
      - name: name
        label: Nome do integrante
        type: string
        required: true
      - name: role
        label: Função na banda
        type: string
      - name: notes
        label: Observações sem dados pessoais
        type: text
