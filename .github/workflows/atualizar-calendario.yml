name: Atualizar calendario da banda
on:
  push:
    branches: [main]
    paths:
      - 'agenda/shows.json'
      - 'scripts/gerar_calendario.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Gerar calendario ICS
        run: python scripts/gerar_calendario.py
      - name: Publicar calendario
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agenda/lippi-leo.ics
          if ! git diff --cached --quiet; then
            git commit -m "Atualizar calendario compartilhado de shows"
            git push
          fi
